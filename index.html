<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBRA DYNAMICS // SECURE VAULT</title>
    <style>
        body {
            background-color: #020406;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: 2px;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            z-index: 100;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        .vault-box {
            border: 1px solid rgba(0, 229, 255, 0.4);
            background-color: rgba(2, 9, 15, 0.95);
            padding: 40px;
            width: 480px;
            min-height: 420px;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.1);
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .system-tag {
            font-size: 0.75rem;
            color: rgba(0, 229, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-align: center;
        }

        .content-area {
            text-align: center;
            flex-grow: 1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        p, .info-block {
            font-size: 0.85rem;
            line-height: 1.7;
            color: #b3f0ff;
            margin-bottom: 25px;
            text-align: left;
        }

        /* DISEÑO DE IMÁGENES CON ESTILO CIBERNÉTICO */
        .corp-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 10px auto;
            border: 1px dashed #00e5ff;
            padding: 5px;
            object-fit: cover;
        }

        .leader-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 10px;
            background: rgba(0, 229, 255, 0.02);
        }

        .leader-img {
            width: 60px;
            height: 60px;
            border: 1px solid #00e5ff;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%); /* Efecto foto de archivo militar */
        }

        .btn-decrypt {
            background-color: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .btn-decrypt:hover {
            background-color: #00e5ff;
            color: #020406;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            font-weight: bold;
        }

        #menu-container {
            display: none;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }

        .sub-text {
            color: #a3ffc2;
            border-left: 2px solid #00e5ff;
            padding-left: 10px;
            margin-top: 15px;
        }

        .btn-back {
            border-color: rgba(0, 229, 255, 0.4);
            color: rgba(0, 229, 255, 0.6);
            font-size: 0.75rem;
            padding: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="vault-box">
        <div class="system-tag" id="sys-tag">[ CONEXIÓN ANÓNIMA ESTABLECIDA ]</div>
        
        <div class="content-area">
            <!-- IMAGEN: LOGO DE INICIO (Puedes cambiar el link de abajo por tu logo) -->
            <img id="main-logo" class="corp-logo" src="https://cdn.discordapp.com/attachments/912353711257423913/1566557051268628551/48210fa2-da97-4a80-a221-f141ca3e9887.png?ex=6ae8f972&is=6ae7a7f2&hm=3929d2c79dcdaac4efa6c9babaa0a5b009586d5bd424cdba75a4e44dc84c3954&" alt="UD Logo">
            
            <h1 id="main-title">U.M.B.R.A. DYNAMICS</h1>
            
            <div id="dynamic-content">
                <p>Acceso restringido al directorio central de Umbra Dynamics. Registros confidenciales de personal, facciones y protocolos operativos.</p>
            </div>
        </div>

        <div class="actions-area">
            <button id="btn-initial" class="btn-decrypt" onclick="mostrarMenu()">
                PRESIONA PARA CONTINUAR
            </button>

            <div id="menu-container">
                <button class="btn-decrypt" onclick="cargarSeccion('sobre-nosotros')">Sobre Nosotros</button>
                <button class="btn-decrypt" onclick="cargarSeccion('quienes-somos')">Quiénes Somos</button>
                <button class="btn-decrypt" onclick="accederArchivosSecretos()">Archivos Protegidos_</button>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="js/main.js"></script>

    <script>
        function mostrarMenu() {
            document.getElementById('btn-initial').style.display = 'none';
            document.getElementById('main-logo').style.display = 'none'; // Escondemos el logo grande en el menú
            document.getElementById('sys-tag').innerText = "[ MENU PRINCIPAL SELECCIONADO ]";
            document.getElementById('main-title').innerText = "DIRECTORIO CENTRAL";
            document.getElementById('dynamic-content').innerHTML = "<p>Seleccione el módulo de información corporativa que desea consultar en la terminal.</p>";
            document.getElementById('menu-container').style.display = 'flex';
        }

        function cargarSeccion(tipo) {
            document.getElementById('menu-container').style.display = 'none';
            let htmlContenido = "";
            
            if(tipo === 'sobre-nosotros') {
                document.getElementById('sys-tag').innerText = "[ EXPEDIENTE // MANIFIESTO ]";
                document.getElementById('main-title').innerText = "SOBRE NOSOTROS";
                htmlContenido = `
                    <div class="info-block">
                        Umbra Dynamics opera en la frontera de la bio-tecnología avanzada y el despliegue de soluciones tácticas globales.
                        <div class="sub-text">// OBJETIVO: Preservar la supremacía de los líderes de facción ante escenarios de colapso planetario.</div>
                    </div>
                `;
            } else if(tipo === 'quienes-somos') {
                document.getElementById('sys-tag').innerText = "[ EXPEDIENTE // ORGANIGRAMA ]";
                document.getElementById('main-title').innerText = "ALTO MANDO";
                
                // AQUÍ SE INTEGRAN LAS IMÁGENES DE LOS LÍDERES (Reemplaza los links en 'src')
                htmlContenido = `
                    <div class="info-block">
                        <div class="leader-profile">
                            <img class="leader-img" src="https://i.pinimg.com/736x/50/1d/0a/501d0a4b4013ddb28dec7591c1543073.jpg" alt="Director V.">
                            <div>
                                <strong>DIRECTOR V.</strong><br>
                                <span style="font-size:0.75rem; color:rgba(0,229,255,0.6);">[Estatus: Activo] // Fundador</span>
                            </div>
                        </div>
                        
                        <div class="leader-profile">
                            <img class="leader-img" src="https://i.pinimg.com/736x/d9/94/dc/d994dcad55ce5ac6b20a80141c8619e8.jpg" alt="Cdr. Thorne">
                            <div>
                                <strong>COMANDANTE THORNE</strong><br>
                                <span style="font-size:0.75rem; color:rgba(0,229,255,0.6);">[Estatus: En Operaciones] // Seguridad</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            htmlContenido += `<button class="btn-decrypt btn-back" onclick="mostrarMenu()">◀ VOLVER AL MENU</button>`;
            document.getElementById('dynamic-content').innerHTML = htmlContenido;
        }
    </script>
</body>
</html>
