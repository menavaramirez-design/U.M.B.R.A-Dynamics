<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBRA DYNAMICS // SECURE VAULT</title>
    <style>
        body {
            background-color: #020406;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: 2px;
            animation: flicker 0.15s infinite;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                linear-gradient(90deg, rgba(0, 229, 255, 0.03), rgba(0, 0, 0, 0.1), rgba(0, 229, 255, 0.03));
            z-index: 100;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        .vault-box {
            border: 1px solid rgba(0, 229, 255, 0.4);
            background-color: rgba(2, 9, 15, 0.95);
            padding: 45px;
            width: 480px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.1);
            position: relative;
            z-index: 20;
        }

        .umbra-logo {
            font-size: 4rem;
            font-weight: 900;
            color: rgba(0, 229, 255, 0.03);
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 15px;
            z-index: -1;
            user-select: none;
        }

        .system-tag {
            font-size: 0.75rem;
            color: rgba(0, 229, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 4px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        p {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #b3f0ff;
            margin-bottom: 35px;
        }

        .blink { animation: parpadeo 1.2s infinite; }

        @keyframes parpadeo { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes flicker { 0% { opacity: 0.99; } 50% { opacity: 1; } 100% { opacity: 0.98; } }

        .btn-decrypt {
            background-color: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-decrypt:hover {
            background-color: #00e5ff;
            color: #020406;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            font-weight: bold;
        }

        /* Contenedor oculto del menú */
        .menu-options {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="vault-box">
        <div class="umbra-logo">UD</div>
        <div class="system-tag">[ CONEXIÓN ANÓNIMA ESTABLECIDA ]</div>
        
        <h1 id="main-title">U.M.B.R.A. DYNAMICS</h1>
        
        <p id="main-text">
            Acceso restringido al directorio central de Umbra Dynamics. Registros confidenciales de personal, facciones y protocolos operativos.
        </p>

        <!-- Botón de entrada inicial -->
        <button id="btn-initial" class="btn-decrypt" onclick="mostrarMenu()">PRESIONA PARA CONTINUAR</button>

        <!-- Menú secreto de 3 botones (se activa al dar clic arriba) -->
        <div id="menu-container" class="menu-options">
            <button class="btn-decrypt" onclick="mostrarSeccion('sobre-nosotros')">Sobre Nosotros</button>
            <button class="btn-decrypt" onclick="mostrarSeccion('quienes-somos')">Quiénes Somos</button>
            <button class="btn-decrypt" onclick="accederArchivosSecretos()">Archivos Protegidos<span class="blink">_</span></button>
        </div>
    </div>

    <!-- Cargar librerías de Firebase -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <script src="js/main.js"></script>

    <script>
        function mostrarMenu() {
            // Ocultar botón inicial y cambiar textos
            document.getElementById('btn-initial').style.display = 'none';
            document.getElementById('main-title').innerText = "DIRECTORIO CENTRAL";
            document.getElementById('main-text').innerText = "Seleccione el módulo de información corporativa que desea consultar.";
            
            // Mostrar los 3 nuevos botones elegantemente
            document.getElementById('menu-container').style.display = 'flex';
        }

        function mostrarSeccion(tipo) {
            if(tipo === 'sobre-nosotros') {
                alert("[MANIFIESTO]: Fundada bajo el principio de evolución controlada. Umbra Dynamics opera en la frontera de la bio-tecnología avanzada.");
            } else if(tipo === 'quienes-somos') {
                alert("[PERSONAL]: Alto Mando Ejecutivo: Director V. // Jefe de Seguridad: Comandante Thorne.");
            }
        }
    </script>
</body>
</html>
