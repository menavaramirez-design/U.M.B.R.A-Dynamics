<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBRA DYNAMICS // SECURE VAULT</title>
    <style>
        body {
            background-color: #020406;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: 2px;
        }

        /* Rejilla de monitor antiguo */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            z-index: 100;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        .vault-box {
            border: 1px solid rgba(0, 229, 255, 0.4);
            background-color: rgba(2, 9, 15, 0.95);
            padding: 45px;
            width: 480px;
            min-height: 380px;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.1);
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .system-tag {
            font-size: 0.75rem;
            color: rgba(0, 229, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 4px;
            text-align: center;
        }

        .content-area {
            text-align: center;
            flex-grow: 1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        p, .info-block {
            font-size: 0.85rem;
            line-height: 1.7;
            color: #b3f0ff;
            margin-bottom: 25px;
            text-align: left;
        }

        .btn-decrypt {
            background-color: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .btn-decrypt:hover {
            background-color: #00e5ff;
            color: #020406;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            font-weight: bold;
        }

        #menu-container {
            display: none;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px;
        }

        .sub-text {
            color: #a3ffc2;
            border-left: 2px solid #00e5ff;
            padding-left: 10px;
            margin-top: 15px;
        }

        .btn-back {
            border-color: rgba(0, 229, 255, 0.4);
            color: rgba(0, 229, 255, 0.6);
            font-size: 0.75rem;
            padding: 8px;
            margin-top: 15px;
        }

        /* CUADRO DE TEXTO INTEGRADO ESTILO TERMINAL */
        .terminal-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid #00e5ff;
            color: #ffffff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .terminal-input:focus {
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .error-message {
            color: #ff3366;
            font-weight: bold;
            border: 1px dashed #ff3366;
            padding: 10px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.8rem;
        }
    </style>
</head>
