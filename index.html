<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBRA DYNAMICS // SECURE VAULT</title>
    <style>
        body {
            background-color: #020406;
            color: #00e5ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: 2px;
        }

        /* Rejilla de monitor antiguo */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            z-index: 100;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
        }

        .vault-box {
            border: 1px solid rgba(0, 229, 255, 0.4);
            background-color: rgba(2, 9, 15, 0.95);
            padding: 45px;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.1);
            position: relative;
            z-index: 20;
        }

        .system-tag {
            font-size: 0.75rem;
            color: rgba(0, 229, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 4px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        p {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #b3f0ff;
            margin-bottom: 35px;
        }

        .btn-decrypt {
            background-color: transparent;
            border: 1px solid #00e5ff;
            color: #00e5ff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .btn-decrypt:hover {
            background-color: #00e5ff;
            color: #020406;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            font-weight: bold;
        }

        /* El contenedor del menú inicia completamente oculto */
        #menu-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="vault-box">
        <div class="system-tag">[ CONEXIÓN ANÓNIMA ESTABLECIDA ]</div>
        
        <h1 id="main-title">U.M.B.R.A. DYNAMICS</h1>
        
        <p id="main-text">
            Acceso restringido al directorio central de Umbra Dynamics. Registros confidenciales de personal, facciones y protocolos operativos.
        </p>

        <!-- Botón de entrada inicial con función directa -->
        <button id="btn-initial" class="btn-decrypt" onclick="document.getElementById('btn-initial').style.display='none'; document.getElementById('main-title').innerText='DIRECTORIO CENTRAL'; document.getElementById('main-text').innerText='Seleccione el módulo de información corporativa que desea consultar.'; document.getElementById('menu-container').style.display='flex';">
            PRESIONA PARA CONTINUAR
        </button>

        <!-- Opciones ocultas del menú -->
        <div id="menu-container">
            <button class="btn-decrypt" onclick="alert('[MANIFIESTO]: Fundada bajo el principio de evolución controlada. Umbra Dynamics opera en la frontera de la bio-tecnología avanzada.')">Sobre Nosotros</button>
            <button class="btn-decrypt" onclick="alert('[PERSONAL SCOUT]: Alto Mando Ejecutivo: Director V. // Jefe de Seguridad: Comandante Thorne.')">Quiénes Somos</button>
            <button class="btn-decrypt" onclick="accederArchivosSecretos()">Archivos Protegidos_</button>
        </div>
    </div>

    <!-- Motores de Firebase y lógica externa -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="js/main.js"></script>

</body>
</html>
